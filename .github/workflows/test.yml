name: tests
on:
  push:
    branches: [main, v1-dev]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: unit tests
        run: python -m unittest discover -s tests -v
  install:
    # the installers, unattended, on real machines: install from a package of this commit, use it,
    # uninstall. WSL is not available on the hosted runners; it is covered by the real-machine test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DURWEG_LANG: en
      DURWEG_AGENT: skip
      DURWEG_NO_START: "1"
      DURWEG_NO_PAUSE: "1"
      DURWEG_VERSION: v0.0.0-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: package this commit
        shell: bash
        run: python tools/package.py v0.0.0-ci "$RUNNER_TEMP/pkg"
      - name: install (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DURWEG_SOURCE="$RUNNER_TEMP/pkg/durweg-v0.0.0-ci.tar.gz" bash install.sh
          D="$HOME/.local/bin/durweg"
          "$D" --version
          "$D" library list | grep write-your-method
          "$D" start write-your-method ci --runs "$RUNNER_TEMP/runs"
          "$D" status "$(ls -d "$RUNNER_TEMP"/runs/*_ci)"
          "$D" uninstall
          test ! -e "$D"
          test -f "$HOME/Durweg/config.json"
      - name: install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          # V1-C-005: a durweg.cmd of another program is left alone
          $own = "$env:LOCALAPPDATA\Durweg\bin"; New-Item -ItemType Directory -Force $own | Out-Null
          Set-Content "$own\durweg.cmd" "@echo other program"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -eq 0) { throw "a foreign durweg.cmd was not refused" }
          if ((Get-Content "$own\durweg.cmd") -ne "@echo other program") { throw "foreign launcher changed" }
          Remove-Item "$own\durweg.cmd"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $D = "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd"
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "version" }
          $lib = & $D library list; $lib; if (-not ($lib -match 'write-your-method')) { throw "library" }
          # V1-C-006: a failed switch puts the previous copy back; durweg keeps working
          $env:DURWEG_TEST_FAIL_SWITCH = "1"; cmd /c Durweg-Install.bat; $rcode = $LASTEXITCODE; Remove-Item Env:DURWEG_TEST_FAIL_SWITCH
          if ($rcode -eq 0) { throw "an injected switch failure was not reported" }
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "durweg broken after a failed switch" }
          & $D start write-your-method ci --runs "$env:RUNNER_TEMP\runs"; if ($LASTEXITCODE -ne 0) { throw "start" }
          $run = Get-ChildItem "$env:RUNNER_TEMP\runs" | Select-Object -First 1
          & $D status $run.FullName; if ($LASTEXITCODE -ne 0) { throw "status" }
          & $D uninstall; if ($LASTEXITCODE -ne 0) { throw "uninstall" }
          Start-Sleep -Seconds 6
          if (Test-Path $D) { throw "launcher still there" }
          if (Test-Path "$env:LOCALAPPDATA\Durweg\v0.0.0-ci") { throw "platform still there" }
          if (-not (Test-Path "$HOME\Durweg\config.json")) { throw "config removed" }
