name: tests
on:
  push:
    branches: [main, v1.1-workflow-management]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: unit tests
        run: python -m unittest discover -s tests -v
  install:
    # the installers, unattended, on real machines: install from a package of this commit, use it,
    # uninstall. WSL is not available on the hosted runners; it is covered by the real-machine test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DURWEG_LANG: en
      DURWEG_AGENT: skip
      DURWEG_NO_START: "1"
      DURWEG_NO_PAUSE: "1"
      DURWEG_VERSION: v0.0.0-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: package this commit
        shell: bash
        run: python tools/package.py v0.0.0-ci "$RUNNER_TEMP/pkg"
      - name: install (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DURWEG_SOURCE="$RUNNER_TEMP/pkg/durweg-v0.0.0-ci.tar.gz" bash install.sh
          D="$HOME/.local/bin/durweg"
          "$D" --version
          "$D" library list | grep write-your-method
          "$D" start write-your-method ci --runs "$RUNNER_TEMP/runs"
          "$D" status "$(ls -d "$RUNNER_TEMP"/runs/*_ci)"
          "$D" uninstall
          test ! -e "$D"
          test -f "$HOME/Durweg/config.json"
      - name: install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          # V1-C-005: a durweg.cmd of another program is left alone
          $own = "$env:LOCALAPPDATA\Durweg\bin"; New-Item -ItemType Directory -Force $own | Out-Null
          Set-Content "$own\durweg.cmd" "@echo other program"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -eq 0) { throw "a foreign durweg.cmd was not refused" }
          if ((Get-Content "$own\durweg.cmd") -ne "@echo other program") { throw "foreign launcher changed" }
          Remove-Item "$own\durweg.cmd"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $D = "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd"
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "version" }
          $lib = & $D library list; $lib; if (-not ($lib -match 'write-your-method')) { throw "library" }
          # V1-C-006: a failed switch puts the previous copy back; durweg keeps working
          $env:DURWEG_TEST_FAIL_SWITCH = "1"; cmd /c Durweg-Install.bat; $rcode = $LASTEXITCODE; Remove-Item Env:DURWEG_TEST_FAIL_SWITCH
          if ($rcode -eq 0) { throw "an injected switch failure was not reported" }
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "durweg broken after a failed switch" }
          & $D start write-your-method ci --runs "$env:RUNNER_TEMP\runs"; if ($LASTEXITCODE -ne 0) { throw "start" }
          $run = Get-ChildItem "$env:RUNNER_TEMP\runs" | Select-Object -First 1
          & $D status $run.FullName; if ($LASTEXITCODE -ne 0) { throw "status" }
          & $D uninstall; if ($LASTEXITCODE -ne 0) { throw "uninstall" }
          Start-Sleep -Seconds 6
          if (Test-Path $D) { throw "launcher still there" }
          if (Test-Path "$env:LOCALAPPDATA\Durweg\v0.0.0-ci") { throw "platform still there" }
          if (-not (Test-Path "$HOME\Durweg\config.json")) { throw "config removed" }
      - name: durweg update to a newer release (Windows, plan v1.1 U1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/package.py v0.0.1 "$env:RUNNER_TEMP\pkg1"
          python tools/package.py v0.0.2 "$env:RUNNER_TEMP\pkg2"
          $env:DURWEG_VERSION = "v0.0.1"
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg1\durweg-v0.0.1.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $env:DURWEG_AGENT = "own"            # choice 3: the agents are not on PATH (V11-C-009)
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $env:DURWEG_AGENT = "skip"
          $skills = @((Get-Content "$HOME\Durweg\.install.json" -Raw | ConvertFrom-Json).skills)
          if ($skills.Count -eq 0) { throw "no skills recorded for choice 3" }
          $D = "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd"
          # the launcher hands back durweg's exit code
          & $D start no-such-workflow x; if ($LASTEXITCODE -ne 1) { throw "launcher exit code $LASTEXITCODE, not 1" }
          $before = [IO.File]::ReadAllBytes($D)
          Remove-Item Env:DURWEG_VERSION
          $env:DURWEG_UPDATE_LATEST = "v0.0.2"
          $env:DURWEG_UPDATE_INSTALLER = "$PWD\Durweg-Install.bat"
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg2\durweg-v0.0.2.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $out = & $D update 2>&1 | Out-String; $rcode = $LASTEXITCODE; $out
          if ($rcode -ne 0) { throw "update exit $rcode" }
          if ($out -notmatch 'updated\s+v0\.0\.1 -> v0\.0\.2') { throw "not updated" }
          if ($out -match 'is not recognized|not recognised') { throw "cmd.exe read on in the launcher" }
          $m = Get-Content "$HOME\Durweg\.install.json" -Raw | ConvertFrom-Json
          if ($m.version -ne 'v0.0.2') { throw "manifest" }
          # V11-C-009: the skills of choice 3 are kept in the manifest and copied anew
          if (@($m.skills).Count -ne $skills.Count) { throw "skills lost from the manifest: $(@($m.skills) -join ', ')" }
          foreach ($k in $m.skills) { if ((Get-Content (Join-Path $k '.durweg-owned')) -notmatch 'v0\.0\.2') { throw "skill not refreshed: $k" } }
          if (-not ((Get-Content "$env:LOCALAPPDATA\Durweg\bin\current.txt") -match 'v0\.0\.2')) { throw "current.txt not switched" }
          # durweg.cmd itself is byte for byte the same: nothing for cmd.exe to misread
          if ([Convert]::ToBase64String([IO.File]::ReadAllBytes($D)) -ne [Convert]::ToBase64String($before)) { throw "durweg.cmd changed" }
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "version after update" }
          $out = & $D update 2>&1 | Out-String; $out
          if ($out -notmatch 'unchanged\s+v0\.0\.2 is the newest') { throw "second update" }
          & $D uninstall; if ($LASTEXITCODE -ne 0) { throw "uninstall" }
          foreach ($k in $skills) { if (Test-Path $k) { throw "uninstall left the skill $k" } }
          Start-Sleep -Seconds 6
      - name: Python in a folder with spaces (V1-C-007)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $j = "C:\py with space"
          New-Item -ItemType Junction -Path $j -Target (Split-Path (Get-Command python).Source) | Out-Null
          $env:DURWEG_TEST_PYTHON_EXE = "$j\python.exe"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $D = "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd"
          if (-not ((Get-Content $D) -match '"C:\\py with space\\python.exe"')) { throw "python path not quoted" }
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "durweg.cmd fails with a spaced python path" }
      - name: install without winget or Python (Windows Sandbox case)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $env:DURWEG_TEST_PYTHON_DOWNLOAD = "1"
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $py = "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe"
          if (-not (Test-Path $py)) { throw "python.org Python not installed" }
          $D = "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd"
          if (-not ((Get-Content $D) -match 'Python312')) { throw "launcher does not use the downloaded Python" }
          & $D --version; if ($LASTEXITCODE -ne 0) { throw "version" }
      - name: rerun probe of WSL never blocks (V1-C-009)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Probe($exe, $arg) {
            $env:DURWEG_TEST_PROBE = '1'; $env:DURWEG_TEST_WSL_EXE = $exe; $env:DURWEG_TEST_WSL_ARGS = $arg
            $env:DURWEG_TEST_WSL_TIMEOUT_MS = '3000'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = cmd /c Durweg-Install.bat | Out-String
            if ($LASTEXITCODE -ne 0) { throw "probe exit $LASTEXITCODE" }
            if ($sw.Elapsed.TotalSeconds -gt 30) { throw "probe took $($sw.Elapsed.TotalSeconds) s" }
            return $out
          }
          if ((Probe 'cmd.exe' '/c exit 0') -notmatch 'installed=True') { throw "success not seen" }
          if ((Probe 'cmd.exe' '/c exit 1') -notmatch 'installed=False') { throw "failure taken as installed" }
          if ((Probe 'C:\no\such\wsl.exe' '') -notmatch 'installed=False') { throw "missing wsl.exe not handled" }
          if ((Probe 'ping.exe' '-n 60 127.0.0.1') -notmatch 'installed=False') { throw "hanging WSL not handled" }
      - name: the guide line names the GitHub README (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $env:DURWEG_GUIDE = 'https://example.org/durweg/'
          $out = cmd /c Durweg-Install.bat | Out-String
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          if ($out -notmatch [regex]::Escape('Guide: https://example.org/durweg/README.md')) { throw "no guide line: $out" }
      - name: values reach WSL's bash as one word, quotes and all (V1-C-012)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($v in @("https://example.org/it's/", "/mnt/c/Users/O'Brien/My Files/durweg.tar.gz", "a'b'c `$HOME ;x")) {
            $env:DURWEG_TEST_QUOTE = $v
            $q = (cmd /c Durweg-Install.bat | Out-String).Trim()
            Remove-Item Env:DURWEG_TEST_QUOTE
            $back = & 'C:\Program Files\Git\bin\bash.exe' -c "printf %s $q"
            if ($back -ne $v) { throw "quoted $v as $q, bash read $back" }
          }
      - name: an agent started its own way gets the skills (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          $env:DURWEG_AGENT = 'own'
          $out = cmd /c Durweg-Install.bat | Out-String
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE`n$out" }
          foreach ($d in @("$HOME\.claude\skills", "$HOME\.codex\skills")) {
            foreach ($s in @('run-workflow', 'write-your-method')) {
              if (-not (Test-Path "$d\$s\SKILL.md")) { throw "missing $d\$s" }
            }
          }
          if ($out -notmatch 'start your agent the way you always do') { throw "no own-way line: $out" }
      - name: Antigravity's settings folder gets the skills (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DURWEG_SOURCE = "$env:RUNNER_TEMP\pkg\durweg-v0.0.0-ci.zip"
          $env:DURWEG_SHA256 = ((Get-Content "$env:DURWEG_SOURCE.sha256") -split '\s+')[0]
          New-Item -ItemType Directory -Force -Path "$HOME\.gemini\antigravity-cli" | Out-Null
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          foreach ($s in @('run-workflow', 'write-your-method')) {
            if (-not (Test-Path "$HOME\.gemini\config\skills\$s\SKILL.md")) { throw "missing Antigravity skill $s" }
          }
          & "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd" uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall" }
          if (Test-Path "$HOME\.gemini\config\skills\run-workflow") { throw "Antigravity skill not removed" }
          Start-Sleep -Seconds 6     # the uninstall removes the program folder a moment later; let it finish
      - name: install from the published GitHub release, download path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:DURWEG_SOURCE -ErrorAction SilentlyContinue
          Remove-Item Env:DURWEG_SHA256 -ErrorAction SilentlyContinue
          $env:DURWEG_VERSION = 'v1.1.0'
          $env:DURWEG_TEST_SHA_URL = 'https://github.com/musetee/durweg/releases/download/v1.1.0/durweg-v1.1.0.zip.sha256'
          $s = (cmd /c Durweg-Install.bat | Out-String).Trim()
          Remove-Item Env:DURWEG_TEST_SHA_URL
          if ($s -notmatch 'sha=[0-9a-f]{64}') { throw "checksum not read: $s" }
          cmd /c Durweg-Install.bat
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          & "$env:LOCALAPPDATA\Durweg\bin\durweg.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "durweg does not run" }
      - name: install from the published GitHub release, download path (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          unset DURWEG_SOURCE DURWEG_SHA256
          DURWEG_VERSION=v1.1.0 bash install.sh
          "$HOME/.local/bin/durweg" --version
